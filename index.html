<!DOCTYPE html>
<html>
<head>
  <title>Sealed Air - Icon Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      padding: 20px;
    }
    .container {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    canvas {
      margin: 10px;
      border-radius: 12px;
      border: 2px solid #ddd;
      max-width: 100%;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 5px;
      width: 90%;
      max-width: 300px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .note {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .icon-preview {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }
    .icon-preview div {
      text-align: center;
    }
    .icon-preview p {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📱 Sealed Air</h1>
  <h2>Icon Generator</h2>
  <p>Download your PWA icons below. Each button downloads a different size.</p>

  <div class="icon-preview">
    <div>
      <canvas id="canvas192" width="192" height="192"></canvas>
      <p>192×192 (Android)</p>
    </div>
    <div>
      <canvas id="canvas512" width="512" height="512"></canvas>
      <p>512×512 (iPhone/Tablet)</p>
    </div>
  </div>

  <div class="button-group">
    <button onclick="downloadIcon('192')">📱 Download 192×192 Icon</button>
    <button onclick="downloadIcon('512')">📱 Download 512×512 Icon</button>
  </div>

  <p class="note">
    Files will download as: <strong>icon-192.png</strong> and <strong>icon-512.png</strong>
  </p>
</div>

<script>
  function drawIcon(canvasId, size) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');

    // Background - Sealed Air blue
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(0, 0, size, size);

    // White circle
    ctx.beginPath();
    ctx.arc(size / 2, size / 2, size / 2.4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // "S" text
    ctx.fillStyle = '#2563eb';
    ctx.font = `bold ${size / 2}px Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('S', size / 2, size / 2 + 5);
  }

  function downloadIcon(size) {
    const canvasId = size === '192' ? 'canvas192' : 'canvas512';
    const canvas = document.getElementById(canvasId);
    
    const link = document.createElement('a');
    link.download = `icon-${size}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // Draw both icons when page loads
  drawIcon('canvas192', 192);
  drawIcon('canvas512', 512);
</script>

</body>
</html>
